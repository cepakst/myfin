# Cheap checks on every push (Linux runner only – macOS minutes cost 10× on private repos).
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'prompts/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron is not needed for typecheck/unit/e2e (the server runs on plain Node).
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright results (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
